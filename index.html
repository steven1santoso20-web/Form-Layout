<!DOCTYPE html>
<html>
<head>
    <title>Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        section {
            width: 380px;
            height: 240px;
            padding: 10px;
            border: 3px solid #908e8e;
            overflow-x: hidden;
            overflow-y: scroll; 
        }

        .form-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 7px;
        }

        .form-row label {
            padding-top: 0;
            align-self: center;
            text-align: center;
        }

        label {
            width: 80px;
            flex-shrink: 0;
            font-size: 14px;
        }

        input {
            width: 245px;
            height: 21px;
            font-size: 13px;
        }

        textarea {
            width: 210px;
            height: 80px;
            font-size: 13px;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            overflow-y: scroll;
            resize: none;
        }

        
            section {
                max-height: 100%;
            }
            input {
                max-width: 100%;
            }
        
    </style>
</head>

<body>
    <section>
        <form>
            <div class="form-row">
                <label for="name">Name:</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="your name here"
                >
            </div>

            <div class="form-row">
                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="your email here"
                >
            </div>
            <div class="form-row">
                <label for="address">Address:</label>
                <textarea id="address" name="address"></textarea>
            </div>
            <div class="form-row">
                <label for="postcode">Postcode:</label>
                <input 
                    type="text" 
                    id="postcode" 
                    name="postcode" 
                    placeholder="postcode here"
                >
            </div>
        </form>
    </section>
</body>
</html>
